name: Publish

# The site is published, not deployed: this builds it and hands the assets to
# GitHub Pages via the gh-pages branch. Deploy is reserved for xsteer, the one
# project with a runtime of its own and environments to deploy into.

on:
  push:
    branches: [main]
  workflow_dispatch:    # allows manual trigger from GitHub UI / gh CLI

concurrency:
  group: publish
  cancel-in-progress: false

# Read by default; the deploy job escalates to write for gh-pages alone.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to sakthipriyan.com
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0        # required for .GitInfo / lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      # The continuum theme is a Hugo Module, so the build needs Go to resolve it.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache-dependency-path: go.sum

      - name: Cache Hugo modules
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/hugo_cache
          key: ${{ runner.os }}-hugomod-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-hugomod-

      - name: Build
        run: hugo --minify --panicOnWarning

      - name: Deploy to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          cname: sakthipriyan.com
