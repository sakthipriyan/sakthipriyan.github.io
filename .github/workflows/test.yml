name: Approve PR

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0        # required for .GitInfo / lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      # The continuum theme is a Hugo Module, so the build needs Go to resolve it.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache-dependency-path: go.sum

      - name: Cache Hugo modules
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/hugo_cache
          key: ${{ runner.os }}-hugomod-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-hugomod-

      - name: Build
        run: hugo --minify
