baseURL: "https://sakthipriyan.com/"
title: "Sakthi Priyan H"
# The theme lives in its own repository and is consumed as a Hugo Module.
# For local theme development, config/development/module.yaml points this at a
# sibling checkout so edits show up without a publish/bump cycle.
module:
  imports:
    - path: github.com/sakthipriyan/hugo-continuum

# Single Hugo site with sections
build:
  writeStats: true

enableGitInfo: true

params:
  # When one subject exists in several formats, the earliest of these speaks
  # for the group: a deck accompanies a talk rather than explaining it, and
  # usually predates its recording by a day with a terser summary, so
  # publication order picks the wrong one.
  formatPrecedence: [blogs, videos, books, tools, slides]
  description: "Systems that Scale. Wealth that Compounds."
  # Identity used by the theme's hero and footer. The theme itself carries no
  # personal data -- everything here belongs to this site.
  author: "Sakthi Priyan H"
  initials: "SP"
  profileImage: "/images/profile.jpg"
  # Social cards and browser icons. These files already existed in static/img
  # but nothing in <head> ever pointed at them.
  ogImage: "/images/profile.jpg"
  twitterHandle: "@sakthipriyan"
  icons:
    - href: "/img/sp.svg"
      type: "image/svg+xml"
    - href: "/img/sp_32.png"
      type: "image/png"
      sizes: "32x32"
    - href: "/img/favicon.png"
      type: "image/png"
      sizes: "16x16"
  sourceRepo: "https://github.com/sakthipriyan/sakthipriyan.github.io"
  sourceBranch: "main"
